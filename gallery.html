<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRUNCH ELITE | Food Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; background: #050505; color: #FFFFFF; overflow-x: hidden; }

    .cursor-dot, .cursor-outline { position: fixed; pointer-events: none; z-index: 9999; border-radius: 50%; }
    .cursor-dot { width: 6px; height: 6px; background: #D4AF37; box-shadow: 0 0 15px #D4AF37; }
    .cursor-outline { width: 45px; height: 45px; border: 2px solid #D4AF37; transition: all 0.12s ease-out; }

    #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; display: flex; justify-content: center; align-items: center; z-index: 10000; transition: 1s; }
    .loader.hide { opacity: 0; visibility: hidden; }
    .loader-ring { width: 150px; height: 150px; border: 3px solid rgba(212, 175, 55, 0.2); border-top: 3px solid #D4AF37; border-right: 3px solid #D4AF37; border-radius: 50%; animation: spinLoader 1s infinite; }
    @keyframes spinLoader { 100% { transform: rotate(360deg); } }
    .loader-text { position: absolute; font-size: 1.8rem; font-weight: 800; color: #D4AF37; animation: pulseText 1s infinite; }
    @keyframes pulseText { 0%,100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

    .navbar { position: fixed; top: 0; width: 100%; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid #D4AF37; transition: all 0.4s; }
    .navbar.scrolled { padding: 0.7rem 5%; background: rgba(5, 5, 5, 0.98); }
    .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .logo-icon { width: 55px; height: 55px; background: #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; color: #050505; animation: rotateLogo 3s ease infinite; }
    @keyframes rotateLogo { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(360deg); } }
    .logo-text { font-size: 2rem; font-weight: 800; color: #D4AF37; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { color: white; text-decoration: none; font-weight: 600; transition: 0.3s; position: relative; }
    .nav-links a::before { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: #D4AF37; transition: width 0.3s; }
    .nav-links a:hover::before, .nav-links a.active::before { width: 100%; }
    .nav-links a:hover, .nav-links a.active { color: #D4AF37; }
    .cart-icon { position: relative; cursor: pointer; font-size: 1.5rem; transition: transform 0.3s; color: #D4AF37; }
    .cart-icon:hover { transform: scale(1.2); }
    .cart-count { position: absolute; top: -10px; right: -12px; background: #D4AF37; color: #050505; font-size: 0.7rem; padding: 2px 7px; border-radius: 50%; font-weight: bold; }
    .hamburger { display: none; font-size: 1.8rem; cursor: pointer; color: #D4AF37; }

    .section-title { text-align: center; font-size: 3rem; margin: 6rem 0 2rem; padding-top: 2rem; font-weight: 800; color: #D4AF37; }
    .masonry-grid { column-count: 4; column-gap: 1.5rem; padding: 0; }
    .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; cursor: pointer; transition: transform 0.3s; }
    .masonry-item img { width: 100%; border-radius: 20px; transition: all 0.4s; border: 1px solid #D4AF37; }
    .masonry-item img:hover { transform: scale(1.03); filter: brightness(1.1); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
    .gallery-item-name {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #D4AF37;
      padding: 8px 5px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .cart-sidebar { position: fixed; top: 0; right: -500px; width: 400px; height: 100%; background: rgba(5, 5, 5, 0.98); backdrop-filter: blur(25px); z-index: 1100; transition: 0.4s; padding: 2rem; border-left: 3px solid #D4AF37; overflow-y: auto; }
    .cart-sidebar.open { right: 0; }
    .cart-sidebar h2 i { color: #D4AF37; }

    .footer-premium { background: linear-gradient(180deg, #0A0A0A, #000000); padding: 3rem 5% 2rem; margin-top: 4rem; border-top: 1px solid #D4AF37; }
    .footer-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; }
    .footer-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
    .footer-logo-icon { width: 50px; height: 50px; background: #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #050505; }
    .footer-col h3 { color: #D4AF37; margin-bottom: 1rem; }
    .footer-col p, .footer-col a { color: #B0B0B0; text-decoration: none; line-height: 2; }
    .footer-col a:hover { color: #D4AF37; }
    .social-icons { display: flex; gap: 1rem; margin-top: 1rem; }
    .social-icons a { width: 40px; height: 40px; background: rgba(212,175,55,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; color: #D4AF37; text-decoration: none; }
    .social-icons a:hover { background: #D4AF37; color: #050505; transform: translateY(-3px); }
    .footer-bottom { text-align: center; padding-top: 2rem; margin-top: 2rem; border-top: 1px solid rgba(212,175,55,0.3); color: #6B6B6B; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #D4AF37; color: #050505; padding: 12px 30px; border-radius: 50px; font-weight: bold; z-index: 1600; display: none; }
    .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; cursor: pointer; }
    .lightbox img { max-width: 90%; max-height: 90%; border-radius: 20px; border: 3px solid #D4AF37; }
    .close-lightbox { position: absolute; top: 20px; right: 40px; font-size: 50px; color: white; cursor: pointer; }

    .container-custom { max-width: 1400px; margin: 0 auto; padding: 0 5%; }

    @media (max-width: 950px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .nav-links.mobile { display: flex; flex-direction: column; position: absolute; top: 70px; left: 0; width: 100%; background: rgba(5,5,5,0.98); padding: 2rem; gap: 1.5rem; }
      .cart-sidebar { width: 100%; right: -100%; }
      .logo-icon { width: 45px; height: 45px; font-size: 1.4rem; }
      .logo-text { font-size: 1.5rem; }
      .section-title { font-size: 2rem; margin: 5rem 0 1rem; }
      .masonry-grid { column-count: 2; }
    }
  </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">KRUNCH ELITE</div>
</div>

<nav class="navbar" id="navbar">
  <div class="logo" onclick="location.href='index.html'">
    <div class="logo-icon">K</div>
    <div class="logo-text">KRUNCH <span style="color:#D4AF37;">ELITE</span></div>
  </div>
  <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="reservation.html">Reservation</a>
    <a href="contact.html">Contact</a>
  </div>
  <div class="cart-icon" id="cartIcon">
    <i class="fas fa-shopping-bag"></i>
    <span class="cart-count" id="cartCount">0</span>
  </div>
</nav>

<main>
  <div class="container-custom">
    <h2 class="section-title">📸 Visual Journey</h2>
    <div class="masonry-grid" id="galleryGrid"></div>
  </div>
</main>

<footer class="footer-premium" id="footer"></footer>

<div class="cart-sidebar" id="cartSidebar">
  <div style="display:flex; justify-content:space-between; margin-bottom:1.5rem;">
    <h2><i class="fas fa-shopping-cart" style="color:#D4AF37;"></i> Your Cart</h2>
    <div id="closeCartBtn" style="font-size:1.8rem; cursor:pointer; color:#D4AF37;">&times;</div>
  </div>
  <div id="cartItemsList"></div>
  <div id="cartTotal" style="font-size:1.5rem; font-weight:800; margin:15px 0; color:#D4AF37;"></div>
  <button class="order-btn" id="checkoutBtn" style="width:100%; background:#D4AF37; color:#050505; border:none; padding:12px; border-radius:40px; font-weight:700; cursor:pointer;">Checkout →</button>
</div>

<div id="toast" class="toast"></div>
<div id="lightbox" class="lightbox"><img id="lightboxImg"><span class="close-lightbox">&times;</span></div>

<script>
  // Gallery items with names
  const galleryItems = [
    { img: "https://images.pexels.com/photos/2983101/pexels-photo-2983101.jpeg", name: "🔥 Signature Zinger Burger" },
    { img: "https://images.pexels.com/photos/825661/pexels-photo-825661.jpeg", name: "🍕 Artisan Pepperoni Pizza" },
    { img: "https://images.pexels.com/photos/1633578/pexels-photo-1633578.jpeg", name: "🍔 Gold Label Wagyu Burger" },
    { img: "https://images.pexels.com/photos/6065572/pexels-photo-6065572.jpeg", name: "🍗 Crispy Fried Chicken" },
    { img: "https://images.pexels.com/photos/1583884/pexels-photo-1583884.jpeg", name: "🍟 Loaded Truffle Fries" },
    { img: "https://images.pexels.com/photos/1126359/pexels-photo-1126359.jpeg", name: "🥤 Gold Milkshake" },
    { img: "https://images.pexels.com/photos/6287764/pexels-photo-6287764.jpeg", name: "🌯 Lamb Shawarma Wrap" },
    { img: "https://images.pexels.com/photos/1600711/pexels-photo-1600711.jpeg", name: "🥪 Wagyu Cheesesteak" },
    { img: "https://images.pexels.com/photos/2673352/pexels-photo-2673352.jpeg", name: "🌯 Spicy Harissa Wrap" },
    { img: "https://images.pexels.com/photos/3026804/pexels-photo-3026804.jpeg", name: "🍰 Molten Lava Cake" },
    { img: "https://images.pexels.com/photos/1639562/pexels-photo-1639562.jpeg", name: "🍕 Margherita Pizza" },
    { img: "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg", name: "🍔 Double Cheese Beast" }
  ];

  let cart = JSON.parse(localStorage.getItem('eliteCart')) || [];

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  function updateCartUI() {
    const count = cart.reduce((a, i) => a + i.qty, 0);
    document.getElementById('cartCount').innerText = count;
    localStorage.setItem('eliteCart', JSON.stringify(cart));
    const container = document.getElementById('cartItemsList');
    if (container) {
      if (cart.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#666;'>Your cart is empty</p>";
      } else {
        container.innerHTML = cart.map(item => `
          <div style="display:flex; justify-content:space-between; margin-bottom:12px; border-bottom:1px solid rgba(212,175,55,0.2); padding:10px 0;">
            <div><strong style="color:#D4AF37;">${item.name}</strong><br>$${item.price}</div>
            <div><button class="qty-btn" data-id="${item.id}" data-delta="-1" style="background:#D4AF37; border:none; width:26px; border-radius:50%; cursor:pointer;">-</button> <span style="margin:0 8px;">${item.qty}</span> <button class="qty-btn" data-id="${item.id}" data-delta="1" style="background:#D4AF37; border:none; width:26px; border-radius:50%; cursor:pointer;">+</button></div>
            <div>$${(item.price * item.qty).toFixed(2)}</div>
          </div>`).join('');
        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.onclick = () => {
            const id = parseInt(btn.dataset.id);
            const delta = parseInt(btn.dataset.delta);
            const idx = cart.findIndex(i => i.id === id);
            if (idx !== -1) {
              cart[idx].qty += delta;
              if (cart[idx].qty <= 0) cart.splice(idx, 1);
              updateCartUI();
            }
          };
        });
      }
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cartTotal').innerHTML = `Total: $${total.toFixed(2)}`;
    }
  }

  function loadGallery() {
    const grid = document.getElementById('galleryGrid');
    if (grid) {
      let html = '';
      // Create 36 items by repeating the gallery items
      for (let i = 0; i < 36; i++) {
        let item = galleryItems[i % galleryItems.length];
        let imgUrl = item.img + `?auto=compress&cs=tinysrgb&w=350&h=450&fit=crop`;
        html += `
          <div class="masonry-item">
            <img src="${imgUrl}" class="gallery-img" data-src="${item.img}" data-name="${item.name}">
            <div class="gallery-item-name">${item.name}</div>
          </div>
        `;
      }
      grid.innerHTML = html;
      
      document.querySelectorAll('.gallery-img').forEach(img => {
        img.onclick = () => {
          const lightbox = document.getElementById('lightbox');
          const lightboxImg = document.getElementById('lightboxImg');
          if (lightbox && lightboxImg) {
            lightboxImg.src = img.dataset.src || img.src;
            lightbox.style.visibility = 'visible';
          }
        };
      });
      
      const lightbox = document.getElementById('lightbox');
      const closeLightbox = document.querySelector('.close-lightbox');
      if (lightbox && closeLightbox) {
        lightbox.onclick = () => lightbox.style.visibility = 'hidden';
        closeLightbox.onclick = () => lightbox.style.visibility = 'hidden';
      }
    }
  }

  function loadFooter() {
    const footer = document.getElementById('footer');
    if (footer) {
      footer.innerHTML = `
        <div class="footer-content">
          <div class="footer-col"><div class="footer-logo"><div class="footer-logo-icon">K</div><h2 style="color:#D4AF37;">KRUNCH ELITE</h2></div><p>The pinnacle of fast food luxury.</p><div class="social-icons"><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-twitter"></i></a><a href="#"><i class="fab fa-facebook-f"></i></a><a href="#"><i class="fab fa-tiktok"></i></a></div></div>
          <div class="footer-col"><h3>Quick Links</h3><p><a href="index.html">Home</a></p><p><a href="menu.html">Menu</a></p><p><a href="gallery.html">Gallery</a></p><p><a href="reservation.html">Reservation</a></p><p><a href="contact.html">Contact</a></p></div>
          <div class="footer-col"><h3>Working Hours</h3><p>Monday - Friday: 11AM - 2AM</p><p>Saturday - Sunday: 10AM - 3AM</p><p>Delivery: 24/7</p></div>
          <div class="footer-col"><h3>Newsletter</h3><div style="display:flex; margin-top:10px;"><input type="email" placeholder="Your email" style="flex:1; padding:10px; background:#1A1A1A; border:1px solid #D4AF37; border-radius:40px 0 0 40px; color:white;"><button onclick="showToast('Subscribed!')" style="background:#D4AF37; border:none; padding:0 15px; border-radius:0 40px 40px 0; cursor:pointer;"><i class="fas fa-paper-plane"></i></button></div></div>
        </div>
        <div class="footer-bottom"><p>© 2025 KRUNCH ELITE — Where Luxury Meets Flavor. All Rights Reserved.</p></div>
      `;
    }
  }

  function init() {
    loadFooter(); loadGallery(); updateCartUI();
    document.getElementById('cartIcon').onclick = () => document.getElementById('cartSidebar').classList.add('open');
    document.getElementById('closeCartBtn').onclick = () => document.getElementById('cartSidebar').classList.remove('open');
    document.getElementById('checkoutBtn').onclick = () => {
      if (cart.length === 0) showToast("Cart is empty");
      else { showToast("🎉 Order confirmed!"); cart = []; updateCartUI(); document.getElementById('cartSidebar').classList.remove('open'); }
    };
    document.getElementById('hamburger').onclick = () => document.getElementById('navLinks').classList.toggle('mobile');
  }

  const canvas = document.getElementById('particleCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function createParticles() {
      particles = [];
      for(let i = 0; i < 80; i++) {
        particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.2, opacity: Math.random() * 0.5 + 0.1 });
      }
    }
    function animateParticles() {
      if(!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
        if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); createParticles(); });
    resizeCanvas(); createParticles(); animateParticles();
  }

  const cursorDot = document.querySelector('.cursor-dot');
  const cursorOutline = document.querySelector('.cursor-outline');
  if (cursorDot && cursorOutline) {
    document.addEventListener('mousemove', (e) => {
      cursorDot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
      cursorOutline.style.transform = `translate(${e.clientX - 22}px, ${e.clientY - 22}px)`;
    });
  }

  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    if (navbar) {
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    }
  });

  window.addEventListener('load', () => {
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 1500);
    init();
  });
</script>
</body>
</html>
