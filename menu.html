  function showPopupMessage(message) {
    document.getElementById('popupMessage').innerText = message;
    document.getElementById('popupOverlay').style.display = 'flex';
    setTimeout(() => document.getElementById('popupOverlay').style.display = 'none', 2000);
  }
  function addToCart(item) {
    const existing = cart.find(i => i.id === item.id);
    if (existing) existing.qty++;
    else cart.push({ ...item, qty: 1 });
    updateCartUI();
    showPopupMessage(`✓ ${item.name} added to cart!`);
  }
  function updateCartUI() {
    const count = cart.reduce((a, i) => a + i.qty, 0);
    document.getElementById('cartCount').innerText = count;
    localStorage.setItem('eliteCart', JSON.stringify(cart));
    const container = document.getElementById('cartItemsList');

          </div>`).join('');
        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.onclick = () => {
            const id = parseInt(btn.dataset.id);
            const delta = parseInt(btn.dataset.delta);
            const idx = cart.findIndex(i => i.id === id);
            if (idx !== -1) {
              cart[idx].qty += delta;
              if (cart[idx].qty <= 0) cart.splice(idx, 1);
              updateCartUI();
            }
          };
        });
      }
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cartTotal').innerHTML = `Total: $${total.toFixed(2)}`;
    }
  }
  function initFlipCards() {
    const cards = document.querySelectorAll('.flip-card');
    cards.forEach(card => {
      card.addEventListener('click', function(e) {
        if (e.target.classList.contains('order-btn') || e.target.classList.contains('add-to-cart-btn')) return;
        if (currentlyFlippedCard && currentlyFlippedCard !== this) currentlyFlippedCard.classList.remove('flipped');
        this.classList.toggle('flipped');
        currentlyFlippedCard = this.classList.contains('flipped') ? this : null;
      });
    });
  }
  function loadFullMenu() {
    const container = document.getElementById('menuContainer');
    if (!container) return;
    let html = '';
    for (const [category, data] of Object.entries(menuData)) {
      html += `<div class="category-header"><div class="category-icon">${data.icon}</div><div class="category-title">${category}</div><div class="category-count">${data.items.length} items</div></div><div class="menu-grid">`;
      data.items.forEach(item => {
        const bestSellerBadge = item.bestSeller ? `<span style="position:absolute; top:15px; left:15px; background:#D4AF37; color:#050505; padding:4px 12px; border-radius:30px; font-size:0.7rem; z-index:10; font-weight:bold;">🔥 BESTSELLER</span>` : '';
        html += `
          <div class="flip-card">
            <div class="flip-card-inner">
              <div class="flip-front">
                ${bestSellerBadge}
                <img src="${item.img}" alt="${item.name}">
                <div style="padding: 10px 0 0;">
                  <h3 style="margin:5px 0; font-size:1.1rem;">${item.name}</h3>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                    <span class="price-tag">$${item.price}</span>
                    <span style="font-size:0.8rem; color:#D4AF37;">${item.spicy !== "No" ? item.spicy : ''}</span>
                  </div>
                  <button class="order-btn add-to-cart-btn" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}" data-img="${item.img}">Add to Cart</button>
                </div>
              </div>
              <div class="flip-back">
                <i class="fas fa-info-circle" style="font-size:2rem;color:#D4AF37;"></i>
                <h3>${item.name}</h3>
                <p style="font-size:0.85rem; padding:0 10px;">${item.desc}</p>
                <div style="margin-top:10px;">
                  <p><i class="fas fa-fire" style="color:#D4AF37;"></i> ${item.calories}</p>
                  <p><i class="fas fa-clock"></i> ${item.prepTime}</p>
                  ${item.spicy !== "No" ? `<p><i class="fas fa-pepper-hot" style="color:#D4AF37;"></i> ${item.spicy}</p>` : ''}
                </div>
                <span class="price-tag">$${item.price}</span>
              </div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }
    container.innerHTML = html;
    document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        addToCart({ id: parseInt(btn.dataset.id), name: btn.dataset.name, price: parseFloat(btn.dataset.price), img: btn.dataset.img });
      };
    });
    initFlipCards();
  }
  function loadFooter() {
    const footer = document.getElementById('footer');
    if (footer) {
      footer.innerHTML = `
        <div class="footer-content">
          <div class="footer-col"><div class="footer-logo"><div class="footer-logo-icon">K</div><h2 style="color:#D4AF37;">KRUNCH ELITE</h2></div><p>The pinnacle of fast food luxury.</p><div class="social-icons"><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-twitter"></i></a><a href="#"><i class="fab fa-facebook-f"></i></a><a href="#"><i class="fab fa-tiktok"></i></a></div></div>
          <div class="footer-col"><h3>Quick Links</h3><p><a href="index.html">Home</a></p><p><a href="menu.html">Menu</a></p><p><a href="gallery.html">Gallery</a></p><p><a href="reservation.html">Reservation</a></p><p><a href="contact.html">Contact</a></p></div>
          <div class="footer-col"><h3>Working Hours</h3><p>Monday - Friday: 11AM - 2AM</p><p>Saturday - Sunday: 10AM - 3AM</p><p>Delivery: 24/7</p></div>
          <div class="footer-col"><h3>Newsletter</h3><div style="display:flex; margin-top:10px;"><input type="email" placeholder="Your email" style="flex:1; padding:10px; background:#1A1A1A; border:1px solid #D4AF37; border-radius:40px 0 0 40px; color:white;"><button onclick="showToast('Subscribed!')" style="background:#D4AF37; border:none; padding:0 15px; border-radius:0 40px 40px 0; cursor:pointer;"><i class="fas fa-paper-plane"></i></button></div></div>
        </div>
        <div class="footer-bottom"><p>© 2025 KRUNCH ELITE — Where Luxury Meets Flavor. All Rights Reserved.</p></div>
      `;
    }
  }
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }
  function init() {
    loadFooter(); loadFullMenu(); updateCartUI();
    document.getElementById('cartIcon').onclick = () => document.getElementById('cartSidebar').classList.add('open');
    document.getElementById('closeCartBtn').onclick = () => document.getElementById('cartSidebar').classList.remove('open');
    document.getElementById('checkoutBtn').onclick = () => {
      if (cart.length === 0) showToast("Cart is empty");
      else { showToast("🎉 Order confirmed!"); cart = []; updateCartUI(); document.getElementById('cartSidebar').classList.remove('open'); }
    };
    document.getElementById('closePopup').onclick = () => document.getElementById('popupOverlay').style.display = 'none';
    document.getElementById('hamburger').onclick = () => document.getElementById('navLinks').classList.toggle('mobile');
  }
  const canvas = document.getElementById('particleCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function createParticles() {
      particles = [];
      for(let i = 0; i < 80; i++) {
        particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.2, opacity: Math.random() * 0.5 + 0.1 });
      }
    }
    function animateParticles() {
      if(!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if(p.x < 0) p.x = canvas.width; if(p.x > canvas.width) p.x = 0;
        if(p.y < 0) p.y = canvas.height; if(p.y > canvas.height) p.y = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); createParticles(); });
    resizeCanvas(); createParticles(); animateParticles();
  }
  const cursorDot = document.querySelector('.cursor-dot');
  const cursorOutline = document.querySelector('.cursor-outline');
  if (cursorDot && cursorOutline) {
    document.addEventListener('mousemove', (e) => {
      cursorDot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
      cursorOutline.style.transform = `translate(${e.clientX - 22}px, ${e.clientY - 22}px)`;
    });
  }
  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    if (navbar) {
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    }
  });
  window.addEventListener('load', () => {
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 1500);
    init();
  });
</script>
